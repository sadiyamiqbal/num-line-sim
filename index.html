<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interactive Number Line Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #111827; /* gray-900 */
            color: #f9fafb; /* gray-50 */
            font-family: 'Inter', system-ui, sans-serif;
            touch-action: manipulation; /* Prevent double-tap zoom on mobile */
            overflow-x: hidden;
        }
        /* Custom styles for canvas to prevent selection */
        canvas {
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        /* Subtle glow for the main container */
        .glow-box {
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.15); /* blue-500 */
            border: 1px solid #374151; /* gray-700 */
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-6 px-4">

    <header class="w-full max-w-5xl flex justify-between items-center mb-8">
        <h1 class="text-2xl md:text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-teal-400">
            Number Line Sim
        </h1>
        <button onclick="downloadApp()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 px-4 rounded-lg shadow-lg hover:shadow-blue-500/50 transition-all flex items-center gap-2 text-sm md:text-base">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            <span class="hidden sm:inline">Download App</span>
        </button>
    </header>

    <main class="w-full max-w-5xl flex flex-col gap-6">
        
        <section class="glow-box bg-gray-800 rounded-2xl p-6 w-full shadow-2xl">
            <form id="calc-form" class="flex flex-col md:flex-row items-end justify-center gap-4 md:gap-6 w-full">
                <div class="flex flex-col w-full md:w-auto">
                    <label class="text-sm text-gray-400 mb-1 font-medium">Number 1</label>
                    <input type="number" id="num1" value="3" required class="w-full md:w-28 bg-gray-900 border border-gray-600 rounded-lg p-3 text-center text-xl font-bold focus:outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-400 transition-colors">
                </div>
                
                <div class="flex flex-col w-full md:w-auto">
                    <label class="text-sm text-gray-400 mb-1 font-medium">Operator</label>
                    <select id="operator" class="w-full md:w-24 bg-gray-900 border border-gray-600 rounded-lg p-3 text-center text-xl font-bold focus:outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-400 appearance-none cursor-pointer text-blue-400">
                        <option value="+">+</option>
                        <option value="-">−</option>
                        <option value="*">×</option>
                        <option value="/">÷</option>
                    </select>
                </div>
                
                <div class="flex flex-col w-full md:w-auto">
                    <label class="text-sm text-gray-400 mb-1 font-medium">Number 2</label>
                    <input type="number" id="num2" value="2" required class="w-full md:w-28 bg-gray-900 border border-gray-600 rounded-lg p-3 text-center text-xl font-bold focus:outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-400 transition-colors">
                </div>

                <button type="submit" id="run-btn" class="w-full md:w-auto h-[54px] bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-2 px-8 rounded-lg shadow-lg hover:shadow-blue-500/30 transition-all active:scale-95">
                    Run Simulation
                </button>
            </form>
        </section>

        <section class="glow-box bg-gray-800 rounded-2xl w-full flex flex-col overflow-hidden relative">
            <div class="p-6 text-center border-b border-gray-700 bg-gray-800/50 z-10">
                <h2 id="status-text" class="text-2xl md:text-3xl font-light text-blue-300 min-h-[40px] tracking-wide">
                    Ready to simulate!
                </h2>
            </div>
            
            <div class="w-full h-[300px] relative bg-gray-900 overflow-hidden" id="canvas-container">
                <canvas id="sim-canvas" class="absolute top-0 left-0 w-full h-full"></canvas>
            </div>
        </section>

    </main>

    <script>
        // DOM Elements
        const form = document.getElementById('calc-form');
        const num1Input = document.getElementById('num1');
        const opSelect = document.getElementById('operator');
        const num2Input = document.getElementById('num2');
        const statusText = document.getElementById('status-text');
        const canvas = document.getElementById('sim-canvas');
        const ctx = canvas.getContext('2d');
        const runBtn = document.getElementById('run-btn');

        // State
        let minBound = -10;
        let maxBound = 10;
        let isAnimating = false;
        
        // Animation variables
        let animationQueue = [];
        let currentAnim = null;
        let currentPos = 0; // The ball's logical position on the number line
        let trail = []; // Array of previous jumps to draw arcs

        // Resize Canvas dynamically
        function resizeCanvas() {
            const container = document.getElementById('canvas-container');
            // Scale for high DPI displays
            const dpr = window.devicePixelRatio || 1;
            canvas.width = container.clientWidth * dpr;
            canvas.height = container.clientHeight * dpr;
            
            // Normalize coordinate system to use CSS pixels
            ctx.scale(dpr, dpr);
            
            // Force redraw immediately
            drawScene();
        }
        window.addEventListener('resize', resizeCanvas);

        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playBoing(pitchMultiplier = 1) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            const baseFreq = 300 * pitchMultiplier;
            osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
            // Quick frequency drop for "boing" effect
            osc.frequency.exponentialRampToValueAtTime(baseFreq / 2, audioCtx.currentTime + 0.3);
            
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function playTada() {
            if (!audioCtx) return;
            // Play a simple C Major arpeggio
            const playNote = (freq, timeOffset) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + timeOffset);
                gain.gain.setValueAtTime(0, audioCtx.currentTime + timeOffset);
                gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + timeOffset + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + timeOffset + 0.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + timeOffset);
                osc.stop(audioCtx.currentTime + timeOffset + 0.5);
            };
            playNote(261.63, 0);    // C4
            playNote(329.63, 0.1);  // E4
            playNote(392.00, 0.2);  // G4
            playNote(523.25, 0.3);  // C5
        }

        function playError() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        // Map logical number to physical X coordinate on canvas
        function getX(val) {
            const padding = 40; // pixels
            // Use CSS width since we scaled the context
            const width = canvas.width / (window.devicePixelRatio || 1); 
            const range = maxBound - minBound;
            
            // Prevent division by zero if bounds are the same
            if (range === 0) return width / 2;
            
            const usableWidth = width - (padding * 2);
            return padding + ((val - minBound) / range) * usableWidth;
        }

        function drawScene() {
            // Get CSS dimensions
            const width = canvas.width / (window.devicePixelRatio || 1);
            const height = canvas.height / (window.devicePixelRatio || 1);
            const yLine = height - 60; // Position of the number line

            // Clear canvas
            ctx.clearRect(0, 0, width, height);

            // Draw Number Line Axis
            ctx.beginPath();
            ctx.moveTo(10, yLine);
            ctx.lineTo(width - 10, yLine);
            ctx.strokeStyle = '#4B5563'; // gray-600
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.stroke();

            // Calculate step size based on range to prevent label overlap
            const range = maxBound - minBound;
            let step = 1;
            if (range > 20 && range <= 50) step = 5;
            if (range > 50 && range <= 100) step = 10;
            if (range > 100) step = 20;
            if (range > 500) step = 100;

            // Draw Ticks and Labels
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.font = '14px Inter, sans-serif';

            for (let i = minBound; i <= maxBound; i++) {
                if (i % step !== 0 && i !== 0) continue; // Always try to show 0

                const x = getX(i);
                
                // Tick mark
                ctx.beginPath();
                ctx.moveTo(x, yLine - 8);
                ctx.lineTo(x, yLine + 8);
                
                if (i === 0) {
                    ctx.strokeStyle = '#3B82F6'; // blue-500 for zero
                    ctx.lineWidth = 3;
                    ctx.fillStyle = '#60A5FA'; // blue-400
                    ctx.font = 'bold 16px Inter, sans-serif';
                } else {
                    ctx.strokeStyle = '#6B7280'; // gray-500
                    ctx.lineWidth = 2;
                    ctx.fillStyle = '#9CA3AF'; // gray-400
                    ctx.font = '14px Inter, sans-serif';
                }
                ctx.stroke();

                // Label
                ctx.fillText(i.toString(), x, yLine + 16);
            }

            // Draw previous jump trails
            trail.forEach(t => {
                drawArc(t.start, t.end, t.progress, yLine, '#3B82F6'); // blue
            });

            // Draw current active animation arc
            if (currentAnim) {
                drawArc(currentAnim.start, currentAnim.end, currentAnim.progress, yLine, '#60A5FA'); // light blue
            }

            // Draw Ball (Character)
            drawBall(getX(currentPos), yLine);
        }

        function drawArc(startVal, endVal, progress, yBase, color) {
            const startX = getX(startVal);
            const endX = getX(endVal);
            const distance = Math.abs(endX - startX);
            
            // Jump height depends on distance, max 120px
            const jumpHeight = Math.min(Math.max(distance * 0.3, 30), 120);
            
            ctx.beginPath();
            // Draw path up to the current progress
            for (let p = 0; p <= progress; p += 0.02) {
                const cx = startX + (endX - startX) * p;
                const cy = yBase - (4 * jumpHeight * p * (1 - p));
                if (p === 0) ctx.moveTo(cx, cy);
                else ctx.lineTo(cx, cy);
            }
            
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.setLineDash([5, 5]); // Dashed line for trails
            ctx.stroke();
            ctx.setLineDash([]); // Reset
        }

        function drawBall(x, yBase) {
            // If animating, calculate logical Y based on parabola
            let y = yBase;
            if (currentAnim) {
                const startX = getX(currentAnim.start);
                const endX = getX(currentAnim.end);
                const distance = Math.abs(endX - startX);
                const jumpHeight = Math.min(Math.max(distance * 0.3, 30), 120);
                const p = currentAnim.progress;
                y = yBase - (4 * jumpHeight * p * (1 - p));
            }

            // Outer glow
            ctx.beginPath();
            ctx.arc(x, y, 16, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(59, 130, 246, 0.3)';
            ctx.fill();

            // Ball body
            ctx.beginPath();
            ctx.arc(x, y, 12, 0, Math.PI * 2);
            ctx.fillStyle = '#3B82F6'; // blue-500
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#93C5FD'; // blue-300
            ctx.stroke();

            // Inner highlight
            ctx.beginPath();
            ctx.arc(x - 4, y - 4, 3, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.fill();
        }

        let lastTime = 0;
        function animateLoop(time) {
            if (!lastTime) lastTime = time;
            const deltaTime = time - lastTime;
            lastTime = time;

            if (currentAnim) {
                // Update progress
                currentAnim.progress += deltaTime / currentAnim.duration;
                
                // Update logical position for the ball rendering
                currentPos = currentAnim.start + (currentAnim.end - currentAnim.start) * currentAnim.progress;

                if (currentAnim.progress >= 1) {
                    currentAnim.progress = 1;
                    currentPos = currentAnim.end; // Snap to end logically
                    
                    // Save to trail
                    trail.push({...currentAnim});
                    currentAnim = null;

                    // Pause slightly between animations
                    setTimeout(() => {
                        processNextAnimation();
                    }, 200);
                }
            }
            
            drawScene();
            requestAnimationFrame(animateLoop);
        }

        function processNextAnimation() {
            if (animationQueue.length > 0) {
                const next = animationQueue.shift();
                if (next.type === 'jump') {
                    currentAnim = {
                        start: next.start,
                        end: next.end,
                        duration: next.duration,
                        progress: 0
                    };
                    // Pitch based on direction
                    playBoing(next.end > next.start ? 1.2 : 0.8);
                } else if (next.type === 'finish') {
                    finishSimulation(next.resultText);
                } else if (next.type === 'error') {
                    finishError(next.errorText);
                }
            }
        }

        // Setup dynamic bounds based on inputs and expected jumps
        function calculateBounds(num1, num2, op, result) {
            let points = [0, num1, result];
            
            // Add intermediate points for multiplication
            if (op === '*') {
                const absNum1 = Math.abs(num1);
                const step = Math.sign(num1) * num2;
                for (let i = 1; i <= absNum1; i++) {
                    points.push(i * step);
                }
            }

            const min = Math.min(...points);
            const max = Math.max(...points);
            
            // Add padding (20% of range or at least 2 units)
            const range = max - min;
            const pad = Math.max(Math.ceil(range * 0.2), 2);
            
            minBound = min - pad;
            maxBound = max + pad;
        }

        function startSimulation(e) {
            e.preventDefault();
            if (isAnimating && (currentAnim || animationQueue.length > 0)) return;
            
            initAudio();

            const n1 = parseInt(num1Input.value, 10);
            const n2 = parseInt(num2Input.value, 10);
            const op = opSelect.value;
            
            if (isNaN(n1) || isNaN(n2)) {
                statusText.innerText = "Please enter valid integers.";
                playError();
                return;
            }

            // Calculate Result
            let result;
            switch(op) {
                case '+': result = n1 + n2; break;
                case '-': result = n1 - n2; break;
                case '*': result = n1 * n2; break;
                case '/': 
                    if (n2 === 0) {
                        statusText.innerText = "Error: Cannot divide by zero.";
                        playError();
                        return;
                    }
                    result = n1 / n2; 
                    break;
            }

            // Setup State
            isAnimating = true;
            trail = [];
            animationQueue = [];
            runBtn.disabled = true;
            runBtn.classList.add('opacity-50', 'cursor-not-allowed');
            statusText.innerHTML = `Calculating: ${n1} ${op} ${n2}`;

            calculateBounds(n1, n2, op, result);
            
            // Reset position to 0 visually before starting
            currentPos = 0;
            drawScene();

            // Generate Animation Queue
            const jumpDuration = 600; // ms

            if (op === '+' || op === '-') {
                // Jump to N1
                if (n1 !== 0) {
                    animationQueue.push({ type: 'jump', start: 0, end: n1, duration: jumpDuration });
                }
                // Jump N2 distance
                // Subtraction is just adding negative N2
                const shift = op === '+' ? n2 : -n2; 
                if (shift !== 0) {
                    animationQueue.push({ type: 'jump', start: n1, end: n1 + shift, duration: jumpDuration });
                }
                
                animationQueue.push({ 
                    type: 'finish', 
                    resultText: `${n1} ${op} ${n2} = <span class="font-bold text-white text-4xl ml-2">${result}</span>` 
                });
            } 
            else if (op === '*') {
                // n1 * n2 means |n1| jumps of size (sign(n1) * n2)
                const jumps = Math.abs(n1);
                const step = Math.sign(n1) * n2;
                
                if (jumps === 0) {
                    // Result is 0
                    animationQueue.push({ 
                        type: 'finish', 
                        resultText: `${n1} × ${n2} = <span class="font-bold text-white text-4xl ml-2">0</span>` 
                    });
                } else {
                    let current = 0;
                    for (let i = 0; i < jumps; i++) {
                        animationQueue.push({ type: 'jump', start: current, end: current + step, duration: jumpDuration });
                        current += step;
                    }
                    animationQueue.push({ 
                        type: 'finish', 
                        resultText: `${n1} × ${n2} = <span class="font-bold text-white text-4xl ml-2">${result}</span>` 
                    });
                }
            } 
            else if (op === '/') {
                // Jump to N1 first
                if (n1 !== 0) {
                    animationQueue.push({ type: 'jump', start: 0, end: n1, duration: jumpDuration });
                }
                
                // Show division by jumping from n1 towards 0 in steps of n2
                // To handle signs correctly for visuals:
                // If n1 and n2 have same sign, result is positive (we count jumps towards 0).
                // If opposite signs, result is negative (we count jumps away from 0? Or just show standard subtraction).
                // Let's standardise visual: Start at N1. Jump by -n2 (if signs match) or +n2 (if signs opposite).
                
                if (n1 % n2 !== 0) {
                    // For non-integer division, just show final jump to result for simplicity
                    animationQueue.push({ type: 'error', errorText: `Result is ${result.toFixed(2)}. Simulation supports integer division.` });
                } else {
                    let current = n1;
                    const stepSize = Math.abs(n2);
                    const direction = -Math.sign(n1); // Move towards 0
                    const actualStep = stepSize * direction;
                    
                    const jumps = Math.abs(result);
                    for(let i = 0; i < jumps; i++){
                        animationQueue.push({ type: 'jump', start: current, end: current + actualStep, duration: jumpDuration });
                        current += actualStep;
                    }

                    animationQueue.push({ 
                        type: 'finish', 
                        resultText: `${n1} ÷ ${n2} = <span class="font-bold text-white text-4xl ml-2">${result}</span>` 
                    });
                }
            }

            // Start queue
            processNextAnimation();
        }

        function finishSimulation(htmlText) {
            statusText.innerHTML = htmlText;
            playTada();
            resetUI();
        }

        function finishError(text) {
            statusText.innerText = text;
            playError();
            resetUI();
        }

        function resetUI() {
            isAnimating = false;
            runBtn.disabled = false;
            runBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }

        function downloadApp() {
            // Clone document
            const clone = document.documentElement.cloneNode(true);
            
            // Clean up dynamically added states to ensure a fresh offline copy
            const statusNode = clone.querySelector('#status-text');
            if (statusNode) statusNode.innerText = "Ready to simulate!";
            
            const btnNode = clone.querySelector('#run-btn');
            if (btnNode) {
                btnNode.disabled = false;
                btnNode.className = btnNode.className.replace('opacity-50', '').replace('cursor-not-allowed', '');
            }

            // Remove scripts injected by Tailwind CDN or extensions just in case
            const scripts = clone.querySelectorAll('script');
            scripts.forEach(s => {
                if(s.src && !s.src.includes('tailwindcss')) {
                    s.parentNode.removeChild(s);
                }
            });

            const html = "<!DOCTYPE html>\n" + clone.outerHTML;
            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'number-line-pro.html';
            document.body.appendChild(a);
            a.click();
            
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Initialization
        window.addEventListener('DOMContentLoaded', () => {
            form.addEventListener('submit', startSimulation);
            
            // Initial render
            resizeCanvas(); 
            requestAnimationFrame(animateLoop);
        });

    </script>
</body>
</html>
