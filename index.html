<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Line Operations Simulation</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #bb86fc;
            --text-color: #e0e0e0;
            --axis-color: #ffffff;
            --ball-color: #03dac6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
            background-color: var(--surface-color);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
            width: 100%;
            max-width: 600px;
        }

        input, select, button {
            background-color: #2c2c2c;
            color: var(--text-color);
            border: 1px solid #444;
            padding: 10px;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
        }

        input[type="number"] {
            width: 70px;
            text-align: center;
        }

        button {
            background-color: var(--primary-color);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            border: none;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.95);
        }

        .secondary-btn {
            background-color: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
        }

        #explanation {
            font-size: 1.1rem;
            min-height: 2em;
            text-align: center;
            margin-bottom: 20px;
            color: #ffb74d;
        }

        canvas {
            background-color: var(--surface-color);
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            max-width: 100%;
            width: 800px;
            height: 300px;
            display: block;
        }
    </style>
</head>
<body>

    <h1>Interactive Number Line</h1>
    
    <div class="controls">
        <input type="number" id="numA" value="-2" step="1" placeholder="A">
        <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*" selected>×</option>
            <option value="/">÷</option>
        </select>
        <input type="number" id="numB" value="-3" step="1" placeholder="B">
        <button id="calcBtn">Animate!</button>
        <button id="downloadBtn" class="secondary-btn">Download App</button>
    </div>

    <div id="explanation">Set the numbers and click Animate!</div>

    <canvas id="simCanvas" width="800" height="300"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const explanationEl = document.getElementById('explanation');
        
        // Audio Context for sound effects
        let audioCtx;
        function playBeep(freq, duration) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        let animationQueue = [];
        let currentAnim = null;
        let scale = { min: -10, max: 10 };
        let currentPos = 0;

        function updateScale(valA, valB, result) {
            let min = Math.min(0, valA, valB, result);
            let max = Math.max(0, valA, valB, result);
            let padding = Math.max(2, Math.abs(max - min) * 0.1);
            scale.min = Math.floor(min - padding);
            scale.max = Math.ceil(max + padding);
        }

        function getX(val) {
            const padding = 40;
            const width = canvas.width - padding * 2;
            const range = scale.max - scale.min;
            return padding + ((val - scale.min) / range) * width;
        }

        function drawNumberLine() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw axis
            ctx.beginPath();
            ctx.moveTo(20, 200);
            ctx.lineTo(canvas.width - 20, 200);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Draw ticks and labels
            ctx.fillStyle = '#ffffff';
            ctx.font = '14px sans-serif';
            ctx.textAlign = 'center';
            for (let i = scale.min; i <= scale.max; i++) {
                let x = getX(i);
                ctx.beginPath();
                ctx.moveTo(x, 195);
                ctx.lineTo(x, 205);
                ctx.stroke();
                
                // Draw numbers (skip some if too crowded)
                if ((scale.max - scale.min) < 30 || i % 5 === 0 || i === 0) {
                    ctx.fillText(i, x, 225);
                }
            }

            // Highlight Zero
            ctx.fillStyle = '#03dac6';
            let zeroX = getX(0);
            ctx.beginPath();
            ctx.arc(zeroX, 200, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        function animate() {
            drawNumberLine();

            if (currentAnim) {
                currentAnim.progress += 0.02; // animation speed
                if (currentAnim.progress >= 1) {
                    currentPos = currentAnim.end;
                    playBeep(400, 0.1);
                    currentAnim = animationQueue.shift() || null;
                } else {
                    let p = currentAnim.progress;
                    // Parabolic arc interpolation
                    let x = getX(currentAnim.start) + (getX(currentAnim.end) - getX(currentAnim.start)) * p;
                    let height = Math.sin(p * Math.PI) * Math.max(30, Math.abs(getX(currentAnim.end) - getX(currentAnim.start)) * 0.3);
                    let y = 200 - 15 - height;

                    ctx.beginPath();
                    ctx.arc(x, y, 12, 0, Math.PI * 2);
                    ctx.fillStyle = '#bb86fc';
                    ctx.fill();
                    
                    // Draw trail/arc
                    ctx.beginPath();
                    ctx.moveTo(getX(currentAnim.start), 200);
                    ctx.quadraticCurveTo(getX(currentAnim.start) + (getX(currentAnim.end) - getX(currentAnim.start)) / 2, 200 - height * 2, x, y + 12);
                    ctx.strokeStyle = 'rgba(187, 134, 252, 0.5)';
                    ctx.setLineDash([5, 5]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            } else {
                // Idle ball
                ctx.beginPath();
                ctx.arc(getX(currentPos), 200 - 12, 12, 0, Math.PI * 2);
                ctx.fillStyle = '#03dac6';
                ctx.fill();
            }

            requestAnimationFrame(animate);
        }

        document.getElementById('calcBtn').addEventListener('click', () => {
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            
            const a = parseFloat(document.getElementById('numA').value);
            const b = parseFloat(document.getElementById('numB').value);
            const op = document.getElementById('operator').value;
            
            if (isNaN(a) || isNaN(b)) {
                explanationEl.textContent = "Please enter valid numbers.";
                return;
            }

            let result;
            animationQueue = [];
            currentPos = 0;

            if (op === '+') {
                result = a + b;
                updateScale(a, b, result);
                animationQueue.push({ start: 0, end: a, progress: 0 });
                animationQueue.push({ start: a, end: result, progress: 0 });
                explanationEl.textContent = `Start at 0, jump to ${a}, then move ${b > 0 ? 'forward' : 'backward'} by ${Math.abs(b)} to reach ${result}.`;
            } 
            else if (op === '-') {
                result = a - b;
                updateScale(a, b, result);
                animationQueue.push({ start: 0, end: a, progress: 0 });
                animationQueue.push({ start: a, end: result, progress: 0 });
                explanationEl.textContent = `Start at 0, jump to ${a}, then subtract ${b} (move ${b > 0 ? 'backward' : 'forward'}) to reach ${result}.`;
            } 
            else if (op === '*') {
                result = a * b;
                updateScale(a, b, result);
                
                let steps = Math.abs(a);
                let stepSize = Math.abs(b);
                let direction = (a < 0 && b < 0) ? 1 : ((a < 0 || b < 0) ? -1 : 1);
                
                let explanation = "";
                if (a < 0 && b < 0) {
                    explanation = `Multiplying a negative by a negative! We take the OPPOSITE of ${steps} negative jumps, moving forward. Result = ${result}.`;
                } else if (a < 0) {
                    explanation = `We take the opposite direction for ${steps} jumps of ${stepSize}. Moving backwards. Result = ${result}.`;
                } else {
                    explanation = `Taking ${steps} jumps of ${b}. Result = ${result}.`;
                }
                explanationEl.textContent = explanation;

                let curr = 0;
                for (let i = 0; i < steps; i++) {
                    let next = curr + (stepSize * direction);
                    animationQueue.push({ start: curr, end: next, progress: 0 });
                    curr = next;
                }
                if (steps === 0) {
                    animationQueue.push({ start: 0, end: 0, progress: 0 });
                }
            } 
            else if (op === '/') {
                if (b === 0) {
                    explanationEl.textContent = "Cannot divide by zero!";
                    return;
                }
                result = a / b;
                updateScale(a, b, result);
                
                explanationEl.textContent = `Dividing ${a} by ${b}. Jumping directly to the result: ${result.toFixed(2)}.`;
                animationQueue.push({ start: 0, end: result, progress: 0 });
            }

            if (!currentAnim && animationQueue.length > 0) {
                currentAnim = animationQueue.shift();
            }
        });

        // Offline Download Feature
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const htmlContent = document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'number-line-sim.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // Initialize animation loop
        requestAnimationFrame(animate);
    </script>
</body>
</html>
